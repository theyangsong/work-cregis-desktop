name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-cregis-desktop
    steps:
      - name: Checkout work-cregis-desktop
        uses: actions/checkout@v4
        with:
          path: work-cregis-desktop

      - name: Checkout eds-desktop
        uses: actions/checkout@v4
        with:
          repository: theyangsong/evergreen-design-system-desktop
          ref: main
          path: eds-desktop

      - name: Log eds-desktop revision
        working-directory: eds-desktop
        run: |
          echo "eds-desktop SHA: $(git rev-parse --short HEAD)"
          git log -1 --oneline

      - name: Verify ModuleMenu hover CSS
        run: grep -q 'itemHover:hover:not(.itemFocused)' eds-desktop/packages/components/src/organisms/module-menu/ModuleMenu.module.css

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: work-cregis-desktop/pnpm-lock.yaml

      - name: Set Vite base path
        working-directory: work-cregis-desktop
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install eds-desktop dependencies
        working-directory: eds-desktop
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: work-cregis-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
